<style>

/* =========================================================
   FONT
========================================================= */

@font-face {
    font-family: "IranNastaliq";
    src:
        url("./font/IranNastaliq.woff2") format("woff2"),
        url("./font/IranNastaliq.ttf") format("truetype");

    font-style: normal;
    font-display: swap;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #ddd;
    font-family: "IranNastaliq", serif;
}


/* =========================================================
   CARD
========================================================= */

.card {
    position: relative;

    width: 100vw;
    height: 100vh;

    max-width: 600px;

    margin: auto;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #fffefa 0%,
            #faf5ef 48%,
            #f2e9e1 100%
        );
}


/* =========================================================
   PAPER TEXTURE
========================================================= */

.card::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 900;

    opacity: .13;

    background-image:
        repeating-linear-gradient(
            0deg,
            rgba(120,90,60,.035) 0px,
            rgba(120,90,60,.035) 1px,
            transparent 1px,
            transparent 5px
        );
}


/* =========================================================
   MUSIC
========================================================= */

.music-btn {

    position: absolute;

    top: 18px;
    left: 18px;

    z-index: 1000;

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,.78);

    box-shadow:
        0 3px 15px rgba(80,55,30,.15);

    font-size: 19px;

    cursor: pointer;
}


/* =========================================================
   STAGES
========================================================= */

.stage {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

.stage.active {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* =========================================================
   ENVELOPE
========================================================= */

#stageEnvelope {
    z-index: 50;
}

/* =========================================================
   ENVELOPE - سبک فیلم
========================================================= */

#stageEnvelope {
    z-index: 100;
}

.envelope {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    /* رنگ کاغذ فیلم */
    background:
        radial-gradient(
            ellipse at center,
            #fffdfa 0%,
            #f8f2e9 55%,
            #eee5d9 100%
        );
}


/* ---------------------------------------------------------
   بافت کاغذ
--------------------------------------------------------- */

.envelope::before {
    content: "";

    position: absolute;
    inset: 0;

    z-index: 1;

    pointer-events: none;

    opacity: .45;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(130,95,60,.025) 0px,
            rgba(130,95,60,.025) 1px,
            transparent 1px,
            transparent 4px
        ),
        repeating-linear-gradient(
            90deg,
            rgba(130,95,60,.018) 0px,
            rgba(130,95,60,.018) 1px,
            transparent 1px,
            transparent 6px
        );
}


/* ---------------------------------------------------------
   دو نیمه پاکت
--------------------------------------------------------- */

.envelope-left,
.envelope-right {

    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    z-index: 5;

    background:
        linear-gradient(
            90deg,
            #eee4d8 0%,
            #f8f2ea 55%,
            #fffdfa 100%
        );

    transition:
        transform 1.8s cubic-bezier(.77,0,.18,1);

    box-shadow:
        0 0 25px rgba(100,70,40,.08);
}


/* سمت چپ */

.envelope-left {

    left: 0;

    border-right:
        1px solid
        rgba(110,80,45,.18);

    transform-origin: left center;
}


/* سمت راست */

.envelope-right {

    right: 0;

    border-left:
        1px solid
        rgba(110,80,45,.18);

    transform-origin: right center;
}


/* ---------------------------------------------------------
   خط وسط پاکت
--------------------------------------------------------- */

.envelope-left::after {

    content: "";

    position: absolute;

    right: 0;

    top: 0;

    width: 1px;

    height: 100%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(100,70,40,.25) 20%,
            rgba(100,70,40,.25) 80%,
            transparent
        );
}

.envelope-right::after {

    content: "";

    position: absolute;

    left: 0;

    top: 0;

    width: 1px;

    height: 100%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(100,70,40,.25) 20%,
            rgba(100,70,40,.25) 80%,
            transparent
        );
}


/* =========================================================
   OPEN
========================================================= */

.envelope.open .envelope-left {

    transform:
        translateX(-102%);
}

.envelope.open .envelope-right {

    transform:
        translateX(102%);
}


/* =========================================================
   WAX SEAL
========================================================= */

.seal {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 88px;
    height: 88px;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    z-index: 20;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #8b765e;

    font-family:
        "IranNastaliq",
        serif;

    font-size: 27px;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff9ed 0%,
            #eadbc4 48%,
            #d4c09e 100%
        );

    border:
        3px solid
        rgba(185,155,108,.35);

    box-shadow:

        0 5px 20px
        rgba(100,75,45,.18),

        inset 0 2px 6px
        rgba(255,255,255,.7),

        inset 0 -3px 7px
        rgba(130,95,55,.12);

    transition:

        opacity .55s ease,

        transform .8s
        cubic-bezier(.2,.8,.2,1);
}


/* نقش ظریف روی مهر */

.seal::before {

    content: "❦";

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 43px;

    color:
        rgba(130,100,65,.15);

    pointer-events: none;
}


/* باز شدن مهر */

.envelope.open .seal {

    opacity: 0;

    transform:
        translate(-50%,-50%)
        scale(1.35);

}
.envelope-left,
.envelope-right {
    will-change: transform;
}

.envelope.open .envelope-left {
    animation: envelopeLeftOpen 1.8s cubic-bezier(.77,0,.18,1) forwards;
}

.envelope.open .envelope-right {
    animation: envelopeRightOpen 1.8s cubic-bezier(.77,0,.18,1) forwards;
}

@keyframes envelopeLeftOpen {

    0% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-3%);
    }

    100% {
        transform: translateX(-102%);
    }
}

@keyframes envelopeRightOpen {

    0% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(3%);
    }

    100% {
        transform: translateX(102%);
    }
}
/* =========================================================
   BOTANICAL FRAME
   قاب بیضی + خوشه ها
========================================================= */

.botanical-frame {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 2;
}


/* ---------------------------------------------------------
   OVAL
--------------------------------------------------------- */

.botanical-oval {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 78%;
    height: 70%;

    transform:
        translate(-50%,-50%)
        scale(.96);

    border:
        1.4px solid rgba(181,145,81,.72);

    border-radius: 50%;

    opacity: 0;

    transition:
        opacity 1.5s ease .15s,
        transform 1.6s ease .15s;
}


/* ---------------------------------------------------------
   ACTIVE OVAL
--------------------------------------------------------- */

.stage.active .botanical-oval {

    opacity: 1;

    transform:
        translate(-50%,-50%)
        scale(1);
}


/* =========================================================
   BOTANICAL SVG
========================================================= */

.botanical {

    position: absolute;

    width: 150px;

    height: 430px;

    overflow: visible;

    opacity: 0;

    transition:
        opacity 1.3s ease .3s,
        transform 1.5s cubic-bezier(.22,.61,.36,1);
}


/* RIGHT */

.botanical.right {

    right: -3px;

    top: 25%;

    transform:
        translateX(35px)
        rotate(2deg);
}


/* LEFT */

.botanical.left {

    left: -3px;

    top: 48%;

    transform:
        translateX(-35px)
        rotate(180deg);
}


/* وقتی اسلاید فعال است */

.stage.active .botanical {

    opacity: 1;

    transform:
        translateX(0)
        rotate(2deg);
}

.stage.active .botanical.left {

    transform:
        translateX(0)
        rotate(182deg);
}


/* =========================================================
   BOTANICAL ANIMATION
========================================================= */

.botanical .branch {

    fill: none;

    stroke: #b99a5e;

    stroke-width: 2.1;

    stroke-linecap: round;

    stroke-linejoin: round;

    stroke-dasharray: 700;

    stroke-dashoffset: 700;

    transition:
        stroke-dashoffset 2s ease .35s;
}

.botanical .leaf {

    fill: none;

    stroke: #b99a5e;

    stroke-width: 1.7;

    stroke-linecap: round;

    opacity: .95;

    transform-origin: center;

    transition:
        opacity .8s ease .8s;
}

.stage.active .botanical .branch {

    stroke-dashoffset: 0;
}

.stage.active .botanical .leaf {

    opacity: 1;
}


/* =========================================================
   TEXT SLIDES
========================================================= */

.text-content {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    z-index: 5;
}


/* ---------------------------------------------------------
   TEXT 1
--------------------------------------------------------- */

#stageText1 {
    z-index: 40;
}

.text-line-one {

    font-family: "IranNastaliq", serif;

    font-size:
        clamp(42px, 10vw, 68px);

    color: #704c34;

    opacity: 0;

    transform:
        translateY(25px);

    transition:
        opacity 1.3s ease,
        transform 1.3s ease;
}

#stageText1.active .text-line-one {

    opacity: 1;

    transform:
        translateY(0);
}


/* ---------------------------------------------------------
   TEXT 2
--------------------------------------------------------- */

#stageText2 {
    z-index: 39;
}

.text-line-two-title {

    font-family: "IranNastaliq", serif;

    font-size:
        clamp(42px, 10vw, 68px);

    color: #704c34;

    opacity: 0;

    transform:
        translateY(25px);

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

.text-line-two-body {

    margin-top: 10px;

    font-family: "IranNastaliq", serif;

    font-size:
        clamp(28px, 6.5vw, 46px);

    line-height: 1.5;

    color: #88694c;

    opacity: 0;

    transform:
        translateY(25px);

    transition:
        opacity 1.2s ease .25s,
        transform 1.2s ease .25s;
}

#stageText2.active .text-line-two-title,
#stageText2.active .text-line-two-body {

    opacity: 1;

    transform:
        translateY(0);
}


/* =========================================================
   COUPLE
========================================================= */

#stageCouple {
    z-index: 30;
}


/* ---------------------------------------------------------
   NAMES
--------------------------------------------------------- */

.names {

    position: absolute;

    top: 3%;

    left: 0;

    width: 100%;

    text-align: center;

    color: #704c34;

    z-index: 10;

    opacity: 0;

    transform:
        translateY(-25px);

    transition:
        opacity 1.2s ease .25s,
        transform 1.2s ease .25s;
}

#stageCouple.active .names {

    opacity: 1;

    transform:
        translateY(0);
}

.names-main {

    font-family: "IranNastaliq", serif;

    font-size:
        clamp(38px, 8vw, 58px);

    line-height: 1.15;
}

.names-sub {

    margin-top: 1px;

    font-family: "IranNastaliq", serif;

    font-size:
        clamp(25px, 5.8vw, 39px);

    line-height: 1;
}


/* =========================================================
   COUPLE PHOTO
========================================================= */

.couple-photo-box {

    position: absolute;

    left: 50%;
    top: 54%;

    width: 65%;
    height: 52%;

    transform:
        translate(-50%,-50%)
        scale(.9);

    overflow: hidden;

    border-radius: 50%;

    background:
        #f8f3ed;

    border:
        1px solid rgba(181,145,81,.22);

    box-shadow:
        0 12px 35px rgba(90,65,35,.16);

    opacity: 0;

    z-index: 5;

    transition:
        opacity 1.3s ease,
        transform 1.3s ease;
}

#stageCouple.active .couple-photo-box {

    opacity: 1;

    transform:
        translate(-50%,-50%)
        scale(1);
}


/* =========================================================
   PHOTO
========================================================= */

.couple-photo {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    /*
       contain باعث می‌شود کل عکس دیده شود
       و از بالا و پایین بریده نشود.
    

    object-fit: contain;*/

    object-position: center;

    border-radius: 50%;

    opacity: 0;

    transition:
        opacity 1.5s ease;
}

.couple-photo.show {
    opacity: 1;
}


/* =========================================================
   HALL
========================================================= */

#stageHall {
    z-index: 20;
}


/* در اسلاید تالار قاب بیضی حذف می‌شود */

#stageHall .botanical-oval {
    display: block;
}


/* =========================================================
   HALL PHOTO
========================================================= */

.hall-photo-box {

    position: absolute;

    left: 50%;
    top: 30%;

    transform:
        translate(-50%,-50%)
        scale(.92);

    width: 78%;
    height: 45%;

    padding: 6px;

    background:
        rgba(255,255,255,.58);

    border:
        1px solid rgba(181,145,81,.45);

    border-radius: 50%;

    box-shadow:
        0 10px 30px rgba(70,45,25,.15);

    opacity: 0;

    z-index: 5;

    overflow: hidden;

    transition:
        opacity 1.3s ease .2s,
        transform 1.3s ease .2s;
}

#stageHall.active .hall-photo-box {

    opacity: 1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.hall-photo {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 50%;
}


/* =========================================================
   HALL CONTENT
========================================================= */

.hall-content {

    position: absolute;

    left: 0;

    bottom: 4%;

    width: 100%;

    text-align: center;

    z-index: 10;

    opacity: 0;

    transform:
        translateY(25px);

    transition:
        opacity 1.3s ease .45s,
        transform 1.3s ease .45s;
}

#stageHall.active .hall-content {

    opacity: 1;

    transform:
        translateY(0);
}


/* =========================================================
   INVITATION
========================================================= */

.hall-invitation {

    font-family: "IranNastaliq", serif;

    font-size:
        clamp(27px, 6vw, 42px);

    color: #806247;

    line-height: 1.2;

    margin-bottom: 2px;

    opacity: 0;

    transform:
        translateY(15px);

    transition:
        opacity 1.2s ease .35s,
        transform 1.2s ease .35s;
}

#stageHall.active .hall-invitation {

    opacity: 1;

    transform:
        translateY(0);
}


/* =========================================================
   HALL TITLE
========================================================= */

.hall-title {

    font-family: "IranNastaliq", serif;

    font-size:
        clamp(25px, 5vw, 45px);

    color: #704c34;

    line-height: 1;
}


/* =========================================================
   DATE
========================================================= */

.hall-date {

    margin-top: 4px;

    font-family: "IranNastaliq", serif;

    font-size:
        clamp(25px, 6vw, 40px);

    color: #806247;

    line-height: 1;
}


/* =========================================================
   TIME
========================================================= */

.hall-time {

    margin-top: 2px;

    font-family: "IranNastaliq", serif;

    font-size:
        clamp(22px, 5vw, 34px);

    color: #806247;

    line-height: 1;
}


/* =========================================================
   COUNTDOWN
========================================================= */

.countdown {

    display: flex;

    direction: rtl;

    justify-content: center;

    gap: 7px;

    margin-top: 7px;
}

.count-item {

    min-width: 48px;

    padding: 3px 6px;

    border-radius: 9px;

    background:
        rgba(255,255,255,.55);
}

.count-number {

    display: block;

    font-family: Arial, sans-serif;

    font-size: 17px;

    color: #725238;
}

.count-label {

    display: block;

    font-family: "IranNastaliq", serif;

    font-size: 17px;

    color: #806247;
}


/* =========================================================
   LOCATION
========================================================= */

.location-btn {

    display: inline-block;

    margin-top: 7px;

    padding: 3px 20px;

    border-radius: 30px;

    background: #806247;

    color: white;

    text-decoration: none;

    font-family: "IranNastaliq", serif;

    font-size: 22px;

    box-shadow:
        0 4px 12px rgba(90,65,35,.15);

    transition:
        transform .2s ease,
        background .2s ease;
}

.location-btn:active {

    transform:
        scale(.95);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px) {

    .botanical {
        width: 125px;
        height: 380px;
    }

    .botanical.right {
        right: -18px;
        top: 25%;
    }

    .botanical.left {
        left: -18px;
        top: 47%;
    }

    .botanical-oval {

        width: 82%;
        height: 68%;
    }


    /* عکس عروس و داماد */

    .couple-photo-box {

        width: 72%;

        height: 72%;

        top: 50%;
    }


    /* عکس تالار */

    .hall-photo-box {

        width: 78%;

        height: 33%;

        top: 29%;
    }


    .hall-content {

        bottom: 3%;
    }

    .names {
        top: 3%;
    }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px) {

    .couple-photo-box {

        width: 75%;

        height: 48%;
    }

    .botanical {

        width: 105px;

        height: 340px;
    }

    .hall-photo-box {

        width: 76%;

        height: 31%;
    }

}



/* =========================================================
   MOBILE ONLY - SCROLL ON FINAL HALL SLIDE
   Layout/appearance otherwise remains unchanged.
========================================================= */
@media (max-width: 480px) {
    #stageHall {
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
    }
}
</style>

</head>


<body>


<div class="card">


<!-- =====================================================
     MUSIC
====================================================== -->

<button
    id="musicBtn"
    class="music-btn">

    🎵

</button>


<audio
    id="music"
    src="music/music.mp3"
    loop>
</audio>



<!-- =====================================================
     STAGE 1
     ENVELOPE
====================================================== -->

<section
    id="stageEnvelope"
    class="stage active">

    <div
        id="envelope"
        class="envelope">

        <div class="envelope-left"></div>

        <div class="envelope-right"></div>

        <div class="seal">
            F&R
        </div>

    </div>

</section>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const envelope =
    document.getElementById("envelope");

const music =
    document.getElementById("music");

const musicBtn =
    document.getElementById("musicBtn");

const stageEnvelope =
    document.getElementById("stageEnvelope");

const stageText1 =
    document.getElementById("stageText1");

const stageText2 =
    document.getElementById("stageText2");

const stageCouple =
    document.getElementById("stageCouple");

const stageHall =
    document.getElementById("stageHall");

const photo1 =
    document.getElementById("photo1");

const photo2 =
    document.getElementById("photo2");


/* =========================================================
   ALL STAGES
========================================================= */

const stages = [

    stageEnvelope,
    stageText1,
    stageText2,
    stageCouple,
    stageHall

];


/* =========================================================
   SHOW STAGE
========================================================= */

function showStage(stage) {

    stages.forEach(function(item) {

        item.classList.remove("active");

    });

    stage.classList.add("active");

}


/* =========================================================
   START
========================================================= */

let started = false;


function startCard() {

    if (started) return;

    started = true;


    /* MUSIC */

    music.play()

        .then(function() {

            musicBtn.innerHTML = "🔊";

        })

        .catch(function() {

            musicBtn.innerHTML = "🎵";

        });


    /* =====================================================
       1. ENVELOPE
       0.4 SECOND
    ===================================================== */

    setTimeout(function() {

        envelope.classList.add("open");

    }, 400);


    /* =====================================================
       2. بنام خالق عشق
       3 SECOND
    ===================================================== */

    setTimeout(function() {

        showStage(stageText1);

    }, 3000);


    /* =====================================================
       3. متن
       6 SECOND
    ===================================================== */

    setTimeout(function() {

        showStage(stageText2);

    }, 6000);


    /* =====================================================
       4. COUPLE
       9 SECOND
    ===================================================== */

    setTimeout(function() {

        showStage(stageCouple);

        photo1.classList.add("show");

    }, 9000);


    /* =====================================================
       5. SECOND PHOTO
       15 SECOND
    ===================================================== */

    setTimeout(function() {

        photo1.classList.remove("show");

        photo2.classList.add("show");

    }, 15000);


    /* =====================================================
       6. HALL
       20 SECOND
    ===================================================== */

    setTimeout(function() {

        photo1.classList.remove("show");

        photo2.classList.remove("show");

        showStage(stageHall);

    }, 20000);

}


/* =========================================================
   START ON FIRST CLICK
========================================================= */

document.addEventListener(
    "click",
    startCard,
    {
        once: true
    }
);


/* =========================================================
   MUSIC BUTTON
========================================================= */

musicBtn.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        if (music.paused) {

            music.play();

            musicBtn.innerHTML = "🔊";

        }

        else {

            music.pause();

            musicBtn.innerHTML = "🔇";

        }

    }
);


/* =========================================================
   COUNTDOWN
========================================================= */

const weddingDate =
    new Date(
        "2026-09-10T19:00:00"
    ).getTime();


function updateCountdown() {

    const now =
        new Date().getTime();

    const distance =
        weddingDate - now;


    if (distance <= 0) {

        document.getElementById("days").innerText = "0";

        document.getElementById("hours").innerText = "0";

        document.getElementById("minutes").innerText = "0";

        document.getElementById("seconds").innerText = "0";

        return;

    }


    const days =
        Math.floor(
            distance /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (distance %
            (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (distance %
            (1000 * 60 * 60)) /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (distance %
            (1000 * 60)) /
            1000
        );


    document.getElementById("days").innerText =
        days;

    document.getElementById("hours").innerText =
        hours;

    document.getElementById("minutes").innerText =
        minutes;

    document.getElementById("seconds").innerText =
        seconds;

}


updateCountdown();


setInterval(
    updateCountdown,
    1000
);

</script>
